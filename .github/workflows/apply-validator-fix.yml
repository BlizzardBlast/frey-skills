name: Apply validator review fix

on:
  pull_request:
    branches: [main]
    paths:
      - .github/validator-fix.patch
      - .github/workflows/apply-validator-fix.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest

    steps:
      - name: Check out pull request branch
        uses: actions/checkout@v6
        with:
          ref: agent/harden-review-and-validation
          fetch-depth: 0

      - name: Apply validator fix
        shell: bash
        run: |
          set -euo pipefail
          git apply --index .github/validator-fix.patch
          git rm .github/validator-fix.patch

      - name: Commit source changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: validate scorecard count relationships"
          git push origin HEAD:agent/harden-review-and-validation
