name: CI

on:
  pull_request:
  push:
  workflow_dispatch:

jobs:
  validate:
    name: Validate repository (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Validate repository metadata
        run: python scripts/validate_repository.py

      - name: Run helper test suite
        run: python -m unittest code-review/scripts/test_collect_review_context.py

      - name: Run repository validator test suite
        run: python -m unittest scripts/test_validate_repository.py

      - name: Ensure origin/main is available
        run: git fetch --no-tags --prune origin +refs/heads/main:refs/remotes/origin/main

      - name: Check whitespace errors
        run: |
          git diff --check
          merge_base="$(git merge-base HEAD origin/main)"
          git diff --check "${merge_base}"...HEAD
