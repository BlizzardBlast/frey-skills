name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate repository (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.12']

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run repository checks
        run: python scripts/check.py --group repository

  agent-skills-spec:
    name: Validate Agent Skills specification
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install reference validator
        run: python -m pip install -r requirements-spec.txt

      - name: Validate canonical skills
        run: python scripts/check.py --group spec

  plugin-bundle:
    name: Build and validate plugin bundle
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Run plugin bundle checks
        run: python scripts/check.py --group plugin

  windows:
    name: Validate Windows (Python 3.12)
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt -r requirements-spec.txt

      - name: Run all deterministic checks
        run: python scripts/check.py --base origin/main

  macos:
    name: Validate macOS (Python 3.12)
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt -r requirements-spec.txt

      - name: Run all deterministic checks
        run: python scripts/check.py --base origin/main

  installation:
    name: Smoke installation (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install the pinned Skills CLI without lifecycle scripts
        run: npm install --prefix "${{ runner.temp }}/frey-smoke-cli" --no-save --ignore-scripts --no-audit --no-fund skills@1.7.2

      - name: Check checkout and documented release installations
        run: python scripts/smoke_install.py --cli "${{ runner.temp }}/frey-smoke-cli/node_modules/skills/bin/cli.mjs"

      - name: Check the published plugin archive
        run: python scripts/smoke_release.py

  codex-client:
    name: Codex client compatibility (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install the pinned Codex CLI without lifecycle scripts
        run: npm install --prefix "${{ runner.temp }}/frey-codex-cli" --no-save --ignore-scripts --no-audit --no-fund @openai/codex@0.150.1

      - name: Check plugin discovery, upgrade, and rollback
        run: python scripts/smoke_codex.py --cli "${{ runner.temp }}/frey-codex-cli/node_modules/@openai/codex/bin/codex.js"

  whitespace:
    name: Check whitespace
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Ensure origin/main is available
        run: git fetch --no-tags --prune origin +refs/heads/main:refs/remotes/origin/main

      - name: Check whitespace errors
        run: python scripts/check.py --group whitespace --base origin/main
