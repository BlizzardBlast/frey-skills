name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate repository (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Validate repository metadata
        run: python scripts/validate_repository.py

      - name: Run review-context test suite
        run: python -m unittest discover -s code-review/scripts -p 'test_*.py'

      - name: Run repository validator test suite
        run: python -m unittest scripts.test_validate_repository

  agent-skills-spec:
    name: Validate Agent Skills specification
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install reference validator
        run: python -m pip install -r requirements-spec.txt

      - name: Validate canonical skills
        shell: bash
        run: |
          set -euo pipefail
          for skill_file in */SKILL.md; do
            skills-ref validate "$(dirname "${skill_file}")"
          done

  plugin-bundle:
    name: Build and validate plugin bundle
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run plugin bundle test suite
        run: python -m unittest scripts.test_build_plugin scripts.test_implementation_execution_contract scripts.test_test_strategy_contract scripts.test_skill_behavior_contracts scripts.test_content_trust_contracts

      - name: Build plugin bundle
        run: python scripts/build_plugin.py --force dist/frey-skills

      - name: Validate plugin bundle
        run: python scripts/validate_plugin_bundle.py dist/frey-skills

  whitespace:
    name: Check whitespace
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Ensure origin/main is available
        run: git fetch --no-tags --prune origin +refs/heads/main:refs/remotes/origin/main

      - name: Check whitespace errors
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          merge_base="$(git merge-base HEAD origin/main)"
          git diff --check "${merge_base}"...HEAD
