name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate repository (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.12']

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run repository checks
        run: python scripts/check.py --group repository

  agent-skills-spec:
    name: Validate Agent Skills specification
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install reference validator
        run: python -m pip install -r requirements-spec.txt

      - name: Validate canonical skills
        run: python scripts/check.py --group spec

  plugin-bundle:
    name: Build and validate plugin bundle
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Run plugin bundle checks
        run: python scripts/check.py --group plugin

  windows:
    name: Validate Windows (Python 3.12)
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt -r requirements-spec.txt

      - name: Run all deterministic checks
        run: python scripts/check.py --base origin/main

  whitespace:
    name: Check whitespace
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Ensure origin/main is available
        run: git fetch --no-tags --prune origin +refs/heads/main:refs/remotes/origin/main

      - name: Check whitespace errors
        run: python scripts/check.py --group whitespace --base origin/main
