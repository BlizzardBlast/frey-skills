name: Bootstrap hardening changes

on:
  pull_request:
    branches: [main]
    paths:
      - .github/bootstrap/**
      - .github/workflows/bootstrap-hardening.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request branch
        uses: actions/checkout@v4
        with:
          ref: agent/harden-review-and-validation
          fetch-depth: 0

      - name: Apply validated patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/bootstrap/part-* > /tmp/frey-hardening.patch.gz.b64
          base64 --decode /tmp/frey-hardening.patch.gz.b64 | gzip --decompress > /tmp/frey-hardening.patch
          git apply --index /tmp/frey-hardening.patch
          git rm .github/bootstrap/part-* .github/workflows/bootstrap-hardening.yml

      - name: Commit final changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: harden review and validation workflows [skip ci]"
          git push origin HEAD:agent/harden-review-and-validation
